services:
  mock_server:
    build: ./mock_server
    ports: ["8030:8030"]
    volumes: ["./corpus:/srv/corpus:ro"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8030/health')"]
      interval: 5s
      retries: 10
  app:
    build: .
    ports: ["9025:9025"]
    environment:
      - MOCK_BASE_URL=http://mock_server:8030
      # - GATEWAY_API_KEY=...   (needed only for a real gateway, see RUNBOOK.md)
    depends_on:
      mock_server:
        condition: service_healthy
